[package]
name = "maxa-device"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "maxa_device"

[[bin]]
name = "maxa-device"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-runtime", "dep:tauri-runtime-wry", "dep:tauri-macros", "dep:tauri-codegen", "dep:tauri-utils"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["full"] }
axum = "=0.8.6"
axum-server = { version = "=0.7.3", features = ["tls-rustls-no-provider"] }
rustls = { version = "=0.23.35", features = ["ring"] }
rcgen = "=0.13.2"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json", "stream"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
mdns-sd = "=0.13.11"

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.9.3", features = ["tray-icon"], optional = true }
# Tauri 2.9.x runtime traits are not compatible with the newer 2.11 transitive resolution.
tauri-runtime = { version = "=2.9.2", optional = true }
tauri-runtime-wry = { version = "=2.9.3", optional = true }
tauri-macros = { version = "=2.5.1", optional = true }
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_System_RemoteDesktop"] }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "=2.5.2", optional = true }
tauri-codegen = { version = "=2.5.1", optional = true }
tauri-utils = { version = "=2.8.1", optional = true }
